name: Publish GitHub-Pages
on:
  workflow_dispatch:
  push:
    tags: [ v* ]

permissions:
  pages: write
  id-token: write

jobs:
  build:
    name: Build GitHub-Pages
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-jdk
        uses: actions/setup-java@v3
        with:
          java-version: '19'
          distribution: 'temurin'
          cache: maven  # 依存関係をキャッシュ

      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.9

      - name: Cache WinLibs
        id: cache-winlibs
        uses: actions/cache@v4
        with:
          path: C:\winlibs
          key: ${{ runner.os }}-winlibs-x86_64-mcf-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r1

      - name: Download and Extract WinLibs
        if: steps.cache-winlibs.outputs.cache-hit != 'true'
        run: |
          # WinLibs の公式リリースからダウンロード（GCC 16.1.0 UCRT）
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0mcf-14.0.0-ucrt-r1/winlibs-x86_64-mcf-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r1.zip"
          $output = "winlibs.zip"
          
          Write-Host "Downloading WinLibs..."
          Invoke-WebRequest -Uri $url -OutFile $output
          
          Write-Host "Extracting..."
          # C:\winlibs に展開（内部に "mingw64" フォルダが作られます）
          Expand-Archive -Path $output -DestinationPath C:\winlibs
          
          Write-Host "Cleaning up ZIP..."
          Remove-Item $output

      - name: Add WinLibs to PATH
        run: |
          echo "C:\winlibs\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: generate site
        run: mvn compile site

      - name: upload pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/

  deploy:
    name: Deploy GitHub-Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deployment
        id: deployment
        uses: actions/deploy-pages@v4
